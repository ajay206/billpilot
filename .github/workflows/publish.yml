name: publish

# Pushes to main publish ghcr.io/ajay206/billpilot:latest and the short SHA.
# Version tags v* publish that tag. Pull requests build the image and do not push.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ajay206/billpilot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=pr,enable=${{ github.event_name == 'pull_request' }}
          labels: |
            org.opencontainers.image.source=https://github.com/ajay206/billpilot
            org.opencontainers.image.url=https://github.com/ajay206/billpilot
            org.opencontainers.image.title=BillPilot
            org.opencontainers.image.description=Phase 1 mock BSS for BillPilot: synthetic telecom billing data and TMF-shaped APIs.

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
