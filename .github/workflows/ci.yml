name: ci

# A push to a pull request branch used to start this workflow twice: once for
# push and once for pull_request. Run it on pull requests, and on main only
# when something lands there without a pull request.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: billpilot
          POSTGRES_PASSWORD: billpilot
          POSTGRES_DB: billpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billpilot -d billpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://billpilot:billpilot@localhost:5432/billpilot_test
      API_KEY_CUSTOMER: test-customer
      API_KEY_CSR: test-csr
      API_KEY_OPS: test-ops
      CUSTOMER_NUMBER: CUST-000001
      CSR_CODE: CSR-A
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: python -m pytest

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci && npm test && npm run build
