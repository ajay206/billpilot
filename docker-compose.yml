services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: billpilot
      POSTGRES_PASSWORD: billpilot
      POSTGRES_DB: billpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billpilot -d billpilot"]
      interval: 5s
      timeout: 5s
      retries: 20

  seed:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://billpilot:billpilot@postgres:5432/billpilot
      SEED: ${SEED:-42}
      CUSTOMER_COUNT: ${CUSTOMER_COUNT:-500}
      MONTHS: ${MONTHS:-6}
      GROUND_TRUTH_PATH: /app/data/ground_truth.json
      ANOMALY_COUNTS: ${ANOMALY_COUNTS:-}
    volumes:
      - ./data:/app/data
    command: ["billpilot", "migrate-and-seed"]
    restart: "no"

  api:
    build: .
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://billpilot:billpilot@postgres:5432/billpilot
      API_KEY_CUSTOMER: ${API_KEY_CUSTOMER:-dev-customer-key}
      API_KEY_CSR: ${API_KEY_CSR:-dev-csr-key}
      API_KEY_OPS: ${API_KEY_OPS:-dev-ops-key}
      CUSTOMER_NUMBER: ${CUSTOMER_NUMBER:-CUST-000001}
      CSR_CODE: ${CSR_CODE:-CSR-A}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_CUSTOMER_PER_MINUTE: ${RATE_LIMIT_CUSTOMER_PER_MINUTE:-120}
      RATE_LIMIT_CSR_PER_MINUTE: ${RATE_LIMIT_CSR_PER_MINUTE:-300}
      RATE_LIMIT_OPS_PER_MINUTE: ${RATE_LIMIT_OPS_PER_MINUTE:-600}
      LLM_BACKEND: ${LLM_BACKEND:-fake}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-16000}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    ports:
      - "8000:8000"

volumes:
  pgdata:
